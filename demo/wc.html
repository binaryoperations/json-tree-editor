<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>json-tree-editor — Web Component demo</title>
    <!-- Exactly one theme at a time. Toolbar swaps href between default and high-contrast. -->
    <link
      id="jte-theme"
      rel="stylesheet"
      data-jte-theme
      href="@binaryoperations/json-tree-editor/themes/default.css"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: #0f1115;
        color: #e6e8ec;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .toolbar {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        flex-wrap: wrap;
      }
      .toolbar button {
        appearance: none;
        font: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        color: #e6e8ec;
        background: #1a1f2a;
        border: 1px solid #2a2f3a;
        border-radius: 6px;
        padding: 0.35rem 0.65rem;
        cursor: pointer;
      }
      .toolbar button:hover {
        border-color: #4b5568;
        background: #232833;
      }
      .toolbar button:focus-visible {
        outline: 2px solid #60a5fa;
        outline-offset: 2px;
      }
      .toolbar button[aria-pressed='true'],
      .toolbar button.btn--active {
        background: #1e3a5f;
        border-color: #3b82f6;
        color: #bfdbfe;
      }
      .panes {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
      }
      @media (max-width: 800px) {
        .panes {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 1fr;
        }
      }
      .pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid #2a2f3a;
      }
      .pane:last-child {
        border-right: none;
      }
      .pane-header {
        flex-shrink: 0;
        display: flex;
        justify-content: space-between;
        padding: 0.4rem 0.75rem;
        font-size: 0.75rem;
        color: #9aa3b2;
        border-bottom: 1px solid #2a2f3a;
        background: #12151c;
      }
      .pane-body {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      textarea {
        width: 100%;
        height: 100%;
        resize: none;
        border: none;
        outline: none;
        padding: 0.75rem;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12.5px;
        line-height: 1.45;
        background: #0c0e12;
        color: #e6e8ec;
      }
      json-tree-editor {
        display: block;
        height: 100%;
        width: 100%;
      }
      .toolbar label {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.8rem;
        font-weight: 600;
        color: #9aa3b2;
        white-space: nowrap;
      }
      .toolbar select {
        appearance: none;
        font: inherit;
        font-size: 0.8rem;
        font-weight: 600;
        color: #e6e8ec;
        background: #1a1f2a;
        border: 1px solid #2a2f3a;
        border-radius: 6px;
        padding: 0.35rem 0.65rem;
        cursor: pointer;
      }
      .toolbar select:hover {
        border-color: #4b5568;
        background: #232833;
      }
      .toolbar select:focus-visible {
        outline: 2px solid #60a5fa;
        outline-offset: 2px;
      }
      /* Host ::part styling (open shadow). Tokens stay in the library presets. */
      json-tree-editor.demo-parts::part(row) {
        box-shadow: inset 0 -1px 0 #3b82f6;
      }
      json-tree-editor.demo-parts::part(search) {
        outline: 2px solid #f59e0b;
      }
      .meta {
        font-size: 0.75rem;
        color: #7d8696;
      }
      #status {
        font-size: 0.75rem;
        color: #86efac;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div id="demo-header"></div>
      <div class="panes">
        <section class="pane" aria-label="JSON source">
          <div class="pane-header">
            <span>Source (host textarea)</span>
            <span>sets <code>.value</code></span>
          </div>
          <div class="pane-body">
            <textarea id="source" spellcheck="false"></textarea>
          </div>
        </section>
        <section class="pane" aria-label="JSON tree web component">
          <div class="pane-header">
            <span>&lt;json-tree-editor&gt;</span>
            <span>change / json-change events</span>
          </div>
          <div class="pane-body">
            <json-tree-editor id="tree"></json-tree-editor>
          </div>
        </section>
      </div>
    </div>
    <!-- Toolbar actions moved into shared header by wc-main.ts -->
    <template id="wc-header-actions">
      <div class="toolbar">
        <span id="status">idle</span>
        <button type="button" id="btn-dnd" aria-pressed="true">DnD: on</button>
        <button type="button" id="btn-sample">Load sample</button>
        <label>
          Scheme
          <select id="sel-scheme" aria-label="Tree color scheme">
            <option value="system" selected>System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label>
          <input type="checkbox" id="chk-hc" />
          High contrast
        </label>
        <label title="json-tree-editor::part(row) / ::part(search)">
          <input type="checkbox" id="chk-parts" />
          ::part demo
        </label>
        <button type="button" id="btn-readonly" aria-pressed="false">Editable</button>
        <span class="meta">vanilla · no Solid host required</span>
      </div>
    </template>
    <script type="module" src="/src/wc-main.ts"></script>
  </body>
</html>
